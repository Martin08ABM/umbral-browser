# Local source-build proposal only. This is intentionally outside the repository
# root and is not ready for submission or a successful Flathub build.
# Blockers are recorded in docs/test-builds.md: offline npm/Rust/Mozilla build
# dependencies are not generated and Surfer bootstrap still downloads toolchains.
app-id: io.github.martin08abm.umbralbrowser
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.mozilla.firefox.BaseApp
base-version: '26.08'
command: umbral-launcher
finish-args:
  - --allow=devel
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=xdg-download:rw
  - --env=DICPATH=/usr/share/hunspell
  - --talk-name=org.a11y.Bus
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.freedesktop.FileManager1
  - --own-name=org.mpris.MediaPlayer2.firefox.*
modules:
  - name: umbral-browser
    buildsystem: simple
    build-commands:
      # The persistent repository sources and the matching Mozilla source tree
      # are the inputs. No packaged Linux .tar.xz or Flatpak bundle is used.
      - install -d umbral-source/engine
      - cp -a firefox-source/. umbral-source/engine/
      - cd umbral-source && npm ci --offline
      - cd umbral-source && npm run surfer -- ci --brand unofficial --display-version 1.0.0
      - cd umbral-source && npm run import -- --verbose
      # TODO(Flathub): replace mach bootstrap with a fully declared offline
      # SDK/toolchain setup before enabling the source compilation below.
      - cd umbral-source && npm run bootstrap
      - cd umbral-source && SURFER_PLATFORM=linux SURFER_COMPAT="$(uname -m)" ZEN_RELEASE=1 npm run build
      - cd umbral-source && SURFER_PLATFORM=linux SURFER_COMPAT="$(uname -m)" npm run package
      - install -d /app/umbral
      - archive="$(find umbral-source/dist -maxdepth 1 -type f -name 'zen-*.tar.xz' -print -quit)" && test -n "$archive" && tar -xJf "$archive" -C /app/umbral --strip-components=1
      - install -Dm0755 umbral-source/build/flatpak/metadata/umbral-launcher /app/bin/umbral-launcher
      - install -Dm0644 umbral-source/build/flatpak/metadata/io.github.martin08abm.umbralbrowser.desktop /app/share/applications/io.github.martin08abm.umbralbrowser.desktop
      - install -Dm0644 umbral-source/build/flatpak/metadata/io.github.martin08abm.umbralbrowser.metainfo.xml /app/share/metainfo/io.github.martin08abm.umbralbrowser.metainfo.xml
      - install -Dm0644 umbral-source/build/flatpak/metadata/io.github.martin08abm.umbralbrowser.png /app/share/icons/hicolor/512x512/apps/io.github.martin08abm.umbralbrowser.png
      - install -Dm0644 umbral-source/build/flatpak/metadata/LICENSE /app/share/licenses/io.github.martin08abm.umbralbrowser/LICENSE
      - install -Dm0644 umbral-source/build/flatpak/metadata/CREDITS.md /app/share/doc/io.github.martin08abm.umbralbrowser/CREDITS.md
    sources:
      - type: git
        url: https://github.com/Martin08ABM/umbral-browser.git
        commit: 323733d61e3bf39961994a20807c3ae3b348d10a
        dest: umbral-source
      - type: archive
        url: https://archive.mozilla.org/pub/firefox/releases/158.0.1/source/firefox-158.0.1.source.tar.xz
        sha256: b5beff55fa73a29a674a867da5922f5d7699f51e351e6bbe4405fcc4ba55a824
        strip-components: 1
        dest: firefox-source
