<groupbox id="umbralAISettings" data-category="paneUmbralAI" hidden="true" class="highlighting-group">
  <label><html:h2 data-l10n-id="umbral-ai-heading" /></label>
  <html:p data-l10n-id="umbral-ai-description" />
  <vbox class="umbral-ai-fields">
    <html:label for="umbralAIEndpoint" data-l10n-id="umbral-ai-endpoint-label" />
    <html:input id="umbralAIEndpoint" type="url" autocomplete="url" />
    <html:p class="description-deemphasized" data-l10n-id="umbral-ai-api-help" />
    <html:label for="umbralAIModel" data-l10n-id="umbral-ai-model-label" />
    <html:input id="umbralAIModel" type="text" maxlength="80" autocomplete="off" />
    <html:label for="umbralAIKey" data-l10n-id="umbral-ai-key-label" />
    <html:input id="umbralAIKey" type="password" maxlength="4096" autocomplete="new-password" />
    <html:label class="umbral-ai-clear-key">
      <html:input id="umbralAIClearKey" type="checkbox" />
      <html:span data-l10n-id="umbral-ai-clear-key" />
    </html:label>
    <checkbox id="umbralAIEnabled" data-l10n-id="umbral-ai-enabled" />
    <button id="umbralAISave" data-l10n-id="umbral-ai-save" />
    <html:p id="umbralAIConfigStatus" role="status" aria-live="polite" />
  </vbox>
</groupbox>
